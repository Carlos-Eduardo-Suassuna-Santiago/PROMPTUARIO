{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senha Redefinida - Promptuario</title>
    <link rel="stylesheet" href="{% static 'css/loginCadastro.css' %}">
    <style>
        .success-icon {
            font-size: 3rem;
            color: #10b981;
            margin-bottom: 1rem;
            animation: slideDown 0.6s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .success-card {
            text-align: center;
            padding: 2rem 0;
        }

        .success-card p {
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }
    </style>
</head>
<body class="login-register-page">
    <div class="login-container">
        <div class="left-side"></div>

        <div class="right-side">
            <div class="login-card">
                <div class="login-header">
                    <h1>Senha Redefinida</h1>
                    <p>Você está pronto para fazer login</p>
                </div>

                <div class="success-card">
                    <div class="success-icon">
                        <i class="fas fa-check-circle"></i>
                    </div>
                    
                    <div class="alert alert-success" style="margin-bottom: 1.5rem; border: none; background: rgba(16, 185, 129, 0.1); color: #10b981;">
                        <strong>Sucesso!</strong> Sua senha foi redefinida com sucesso.
                    </div>
                    
                    <p>
                        Você pode agora fazer login com sua nova senha no sistema Promptuario.
                    </p>
                    
                    <a href="{% url 'accounts:login' %}" class="btn btn-primary">Fazer Login</a>
                </div>

                <div style="text-align: center; margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--border-color);">
                    <small style="color: #94a3b8;">
                        <i class="fas fa-lock-open"></i> Sua conta está segura com você
                    </small>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
