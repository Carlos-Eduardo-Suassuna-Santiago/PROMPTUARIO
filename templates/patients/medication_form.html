{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Adicionar Medicamento - {{ patient.user.get_full_name }}{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-lg-8 offset-lg-2">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Adicionar Medicamento</h4>
                    <small>Paciente: <strong>{{ patient.user.get_full_name }}</strong></small>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        {{ form|crispy }}
                        <div class="mt-3">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save"></i> Salvar Medicamento
                            </button>
                            <a href="{% url 'patients:patient_detail' patient.pk %}" class="btn btn-secondary">
                                <i class="fas fa-arrow-left"></i> Voltar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
